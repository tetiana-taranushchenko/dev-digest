# evals — targeted eval runs for the .claude harness (skills / agents / CLAUDE.md).
#
# On a PR:
#   - .claude/skills/<name>/**  changed  -> run evals/skills/<name>  (if it has evals)
#   - .claude/agents/<name>.md  changed  -> run evals/agents/<name>  (if it has evals)
#   - any CLAUDE.md (root or package) changed -> run the full workflow eval (evals/workflow)
#
# A changed skill/agent with no evals written yet is skipped (logged, not failed) — see
# evals/src/scaffold.ts for how to add evals for one. Model is OpenRouter (see evals/README.md
# "Wiring it into GitHub Actions"), default google/gemini-2.5-flash — verified in evals/README.md
# to pass both content checks and subagent-dispatch checks, unlike deepseek/deepseek-chat which
# does the work inline instead of dispatching. Override per tier via repo Variables
# (Settings -> Secrets and variables -> Actions -> Variables): EVAL_MODEL_SKILLS,
# EVAL_MODEL_AGENTS, EVAL_MODEL_WORKFLOW (+ _JUDGE_ variants). Needs OPENROUTER_API_KEY as a
# repo Secret.
name: evals

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - 'CLAUDE.md'
      - '**/CLAUDE.md'
      - 'evals/**'

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  OPENROUTER_BASE_URL: http://localhost:4000
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  detect-changes:
    name: detect changed skills / agents / CLAUDE.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      claude_md_changed: ${{ steps.detect.outputs.claude_md_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: diff PR against base and classify changes
        id: detect
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")

          SKILLS=$(echo "$CHANGED" \
            | grep -oE '^\.claude/skills/[^/]+' \
            | sed 's#\.claude/skills/##' \
            | sort -u | jq -R . | jq -sc .)

          AGENTS=$(echo "$CHANGED" \
            | grep -oE '^\.claude/agents/[^/]+\.md$' \
            | sed -E 's#\.claude/agents/##; s#\.md$##' \
            | grep -vE '^(README|WORKFLOW_INSIGHTS)$' \
            | sort -u | jq -R . | jq -sc .)

          if echo "$CHANGED" | grep -qE '(^|/)CLAUDE\.md$'; then
            CLAUDE_MD=true
          else
            CLAUDE_MD=false
          fi

          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          echo "agents=$AGENTS" >> "$GITHUB_OUTPUT"
          echo "claude_md_changed=$CLAUDE_MD" >> "$GITHUB_OUTPUT"

          echo "Changed skills: $SKILLS"
          echo "Changed agents: $AGENTS"
          echo "CLAUDE.md changed: $CLAUDE_MD"

  skill-evals:
    name: skill evals
    needs: detect-changes
    if: needs.detect-changes.outputs.skills != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ vars.EVAL_MODEL_SKILLS || 'google/gemini-2.5-flash' }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL_SKILLS || 'google/gemini-2.5-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: keep only changed skills that actually have evals
        id: scope
        run: |
          TARGETS=""
          for name in $(echo '${{ needs.detect-changes.outputs.skills }}' | jq -r '.[]'); do
            if [ -f "skills/$name/$name.eval.ts" ]; then
              echo "✓ $name has evals — will run"
              TARGETS="$TARGETS skills/$name"
            else
              echo "⏭  skip: $name — no evals written yet"
            fi
          done
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - if: steps.scope.outputs.targets != ''
        run: docker compose -f proxy/docker-compose.yml up -d
      - if: steps.scope.outputs.targets != ''
        run: pnpm proxy:wait
      - if: steps.scope.outputs.targets != ''
        run: pnpm vitest run ${{ steps.scope.outputs.targets }}
      - if: always() && steps.scope.outputs.targets != ''
        run: docker compose -f proxy/docker-compose.yml down
      - if: steps.scope.outputs.targets == ''
        run: echo "No changed skill has evals yet — nothing to run."

  agent-evals:
    name: agent evals
    needs: detect-changes
    if: needs.detect-changes.outputs.agents != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ vars.EVAL_MODEL_AGENTS || 'google/gemini-2.5-flash' }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL_AGENTS || 'google/gemini-2.5-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: keep only changed agents that actually have evals
        id: scope
        run: |
          # An agent whose .md frontmatter description starts with "EXPERIMENTAL" is a
          # deliberate A/B research variant (see architecture-reviewer-lite.md) — it is
          # expected to score differently from its strict counterpart on purpose, so its
          # eval result must not block the PR. Everything else blocks normally.
          TARGETS=""
          EXPERIMENTAL=""
          for name in $(echo '${{ needs.detect-changes.outputs.agents }}' | jq -r '.[]'); do
            if [ ! -f "agents/$name/$name.eval.ts" ]; then
              echo "⏭  skip: $name — no evals written yet"
              continue
            fi
            if grep -qE "^description: ['\"]?EXPERIMENTAL" "../.claude/agents/$name.md" 2>/dev/null; then
              echo "≈ $name has evals — will run (EXPERIMENTAL, informational only)"
              EXPERIMENTAL="$EXPERIMENTAL agents/$name"
            else
              echo "✓ $name has evals — will run (blocking)"
              TARGETS="$TARGETS agents/$name"
            fi
          done
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "experimental=$EXPERIMENTAL" >> "$GITHUB_OUTPUT"

      - if: steps.scope.outputs.targets != '' || steps.scope.outputs.experimental != ''
        run: docker compose -f proxy/docker-compose.yml up -d
      - if: steps.scope.outputs.targets != '' || steps.scope.outputs.experimental != ''
        run: pnpm proxy:wait
      - if: steps.scope.outputs.targets != ''
        run: pnpm vitest run ${{ steps.scope.outputs.targets }}
      - name: experimental agent evals (informational only — does not fail the job)
        if: steps.scope.outputs.experimental != ''
        continue-on-error: true
        run: pnpm vitest run ${{ steps.scope.outputs.experimental }}
      - if: always() && (steps.scope.outputs.targets != '' || steps.scope.outputs.experimental != '')
        run: docker compose -f proxy/docker-compose.yml down
      - if: steps.scope.outputs.targets == '' && steps.scope.outputs.experimental == ''
        run: echo "No changed agent has evals yet — nothing to run."

  claude-md-evals:
    name: full workflow evals (CLAUDE.md changed)
    needs: detect-changes
    if: needs.detect-changes.outputs.claude_md_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ vars.EVAL_MODEL_WORKFLOW || 'google/gemini-2.5-flash' }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL_WORKFLOW || 'google/gemini-2.5-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm eval:workflow
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
